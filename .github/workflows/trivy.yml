name: Trivy Security Scan

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

jobs:
  trivy:
    name: Trivy (${{ matrix.scan-type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - scan-type: fs
            scanners: vuln
          - scan-type: config
            scanners: misconfig
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan dependencies and IaC with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: ${{ matrix.scan-type }}
          scan-ref: '.'
          scanners: ${{ matrix.scanners }}
          trivy-config: .github/trivy/config.yml
          format: sarif
          output: trivy-${{ matrix.scan-type }}-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '1'
          cache: false

      - name: Upload Trivy results to GitHub Security
        if: ${{ !cancelled() && hashFiles(format('trivy-{0}-results.sarif', matrix.scan-type)) != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.scan-type }}-results.sarif
          category: trivy-${{ matrix.scan-type }}

      - name: Test custom Helm transport check
        if: ${{ !cancelled() && matrix.scan-type == 'config' }}
        run: python3 .github/trivy/test_helm_transport.py
